[project]
name = "efefo"
version = "1.1.0"
description = "SAP EWM inventory, FEFO va audit cho nhieu site"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "requests>=2.31",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "freezegun>=1.4"]

[project.scripts]
efefo = "efefo.cli:main"

[tool.setuptools.packages.find]
include = ["efefo*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "parity: so sanh ket qua voi script goc SAP_FULL_27_8_v5.py (can bien EFEFO_LEGACY_SCRIPT)",
    "stress: kiem thu tai lon va hieu nang",
]
addopts = "-q"
